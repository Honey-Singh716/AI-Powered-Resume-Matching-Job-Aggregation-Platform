<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruitAI — AI-Powered Job Matching Platform</title>
    <meta name="description" content="Upload your resume and get AI-powered job recommendations, skills analysis, and career insights. Find your perfect match.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div id="app">
        <!-- Sidebar (injected by JS for authenticated views) -->
        <aside id="sidebar" class="sidebar hidden"></aside>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Wrapper -->
        <div id="main-wrapper" class="main-wrapper no-sidebar">
            <!-- Topbar (injected by JS for authenticated views) -->
            <header id="topbar" class="topbar hidden"></header>

            <!-- Main Content Area — views injected here -->
            <main id="main-content"></main>
        </div>
    </div>

    <!-- ===================== TEMPLATES ===================== -->

    <!-- LANDING PAGE -->
    <template id="view-landing">
        <div class="landing-page">
            <!-- Landing Nav -->
            <nav class="landing-nav">
                <div class="landing-nav-inner">
                    <div class="sidebar-logo">
                        <div class="sidebar-logo-icon"></div>
                        <span class="sidebar-logo-text">RecruitAI</span>
                    </div>
                    <div class="landing-nav-links">
                        <button class="btn btn-ghost" onclick="navigateTo('login')">Log In</button>
                        <button class="btn btn-primary" onclick="navigateTo('login')">Get Started</button>
                    </div>
                </div>
            </nav>

            <!-- Hero -->
            <section class="hero" id="landing-hero">
                <div class="hero-badge">
                    <span></span>
                    <span>AI-Powered Career Matching</span>
                </div>
                <h1>Find Your <span class="gradient-text">Perfect Job</span> With AI Precision</h1>
                <p>Upload your resume and let our AI analyze your skills, match you with ideal opportunities, and accelerate your career growth.</p>
                <div class="hero-actions">
                    <button class="btn btn-primary btn-lg" onclick="document.getElementById('landing-upload-input').click()">
                        Upload Resume
                    </button>
                    <button class="btn btn-secondary btn-lg" onclick="document.getElementById('upload-section').scrollIntoView({behavior:'smooth'})">
                        Learn More ↓
                    </button>
                </div>
            </section>

            <!-- Upload Zone -->
            <section class="upload-zone-section" id="upload-section">
                <div class="upload-zone" id="landing-upload-zone">
                    <input type="file" id="landing-upload-input" accept=".pdf" onchange="handleLandingUpload(event)">
                    <div class="upload-zone-icon"></div>
                    <h3>Drop your resume here</h3>
                    <p>Supports PDF files up to 10MB</p>
                </div>
                <div id="landing-upload-status"></div>
            </section>

            <!-- Analysis Preview (shown after upload) -->
            <div id="landing-analysis-preview" class="analysis-preview hidden"></div>

            <!-- How It Works -->
            <section class="how-it-works">
                <h2>How It <span class="gradient-text">Works</span></h2>
                <div class="steps-grid">
                    <div class="step-card fade-in-delay-1">
                        <div class="step-number">1</div>
                        <h3>Upload Resume</h3>
                        <p>Upload your PDF resume and our AI instantly extracts your skills, experience, and qualifications.</p>
                    </div>
                    <div class="step-card fade-in-delay-2">
                        <div class="step-number">2</div>
                        <h3>AI Analysis</h3>
                        <p>Our advanced algorithms analyze your profile against thousands of job listings to find the best matches.</p>
                    </div>
                    <div class="step-card fade-in-delay-3">
                        <div class="step-number">3</div>
                        <h3>Get Matched</h3>
                        <p>Receive personalized job recommendations ranked by AI match score, with actionable career insights.</p>
                    </div>
                </div>
            </section>

            <!-- Features -->
            <section class="features-section">
                <h2>Why Choose <span class="gradient-text">RecruitAI</span></h2>
                <div class="features-grid">
                    <div class="feature-card fade-in-delay-1">
                        <div class="feature-icon"></div>
                        <h3>AI Match Scoring</h3>
                        <p>Get percentage-based match scores for every job based on semantic analysis of your skills and experience.</p>
                    </div>
                    <div class="feature-card fade-in-delay-2">
                        <div class="feature-icon"></div>
                        <h3>Skills Gap Analysis</h3>
                        <p>Identify missing skills and get AI-powered suggestions to improve your profile and marketability.</p>
                    </div>
                    <div class="feature-card fade-in-delay-3">
                        <div class="feature-icon"></div>
                        <h3>AI Career Assistant</h3>
                        <p>Chat with our AI for career advice, interview prep, resume tips, and personalized guidance.</p>
                    </div>
                    <div class="feature-card fade-in-delay-4">
                        <div class="feature-icon"></div>
                        <h3>Real-Time Job Feed</h3>
                        <p>Access jobs from multiple sources updated in real-time, including remote opportunities worldwide.</p>
                    </div>
                </div>
            </section>

            <!-- CTA -->
            <section class="landing-cta">
                <h2>Ready to <span class="gradient-text">Transform</span> Your Job Search?</h2>
                <p>Join thousands of candidates who found their dream jobs using AI-powered matching.</p>
                <button class="btn btn-primary btn-lg" onclick="navigateTo('login')">Create Free Account →</button>
            </section>

            <!-- Footer -->
            <footer class="landing-footer">
                <p>© 2026 RecruitAI. Built with AI for smarter hiring.</p>
            </footer>
        </div>
    </template>

    <!-- LOGIN / REGISTER -->
    <template id="view-login">
        <div class="auth-page">
            <div class="auth-card">
                <div style="text-align:center; margin-bottom: var(--space-6);">
                    <div class="sidebar-logo" style="justify-content:center; margin-bottom: var(--space-4);">
                        <div class="sidebar-logo-icon"></div>
                        <span class="sidebar-logo-text">RecruitAI</span>
                    </div>
                    <h1>Welcome Back</h1>
                    <p class="subtitle" style="margin-bottom:0;">Sign in to your account to continue.</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                    <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Register</button>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="form-group">
                        <label for="auth-email">Email</label>
                        <input type="email" id="auth-email" class="form-input" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label for="auth-password">Password</label>
                        <input type="password" id="auth-password" class="form-input" required placeholder="••••••••">
                    </div>

                    <div class="form-group hidden" id="role-group">
                        <label for="auth-role">I am a</label>
                        <select id="auth-role" class="form-input">
                            <option value="candidate">Candidate — looking for jobs</option>
                            <option value="recruiter">Recruiter — hiring talent</option>
                        </select>
                    </div>

                    <div id="auth-error" class="form-error"></div>

                    <button type="submit" class="btn btn-primary btn-lg btn-full" id="auth-submit" style="margin-top: var(--space-4);">
                        Sign In
                    </button>
                </form>

                <p style="text-align:center; margin-top: var(--space-5); font-size: 0.813rem; color: var(--text-tertiary);">
                    <span id="auth-switch-text">Don't have an account?</span>
                    <a href="#" onclick="switchAuthTab(isLoginMode?'register':'login'); return false;" id="auth-switch-link" style="color: var(--primary); font-weight: 500;">Sign up</a>
                </p>
            </div>
        </div>
    </template>

    <!-- CANDIDATE DASHBOARD -->
    <template id="view-candidate-dashboard">
        <div class="fade-in">
            <div class="page-header">
                <h1>Dashboard</h1>
                <p>Welcome back! Here's your career snapshot.</p>
            </div>

            <!-- Stats Row -->
            <div class="stats-grid" id="dashboard-stats">
                <div class="stat-card fade-in-delay-1">
                    <div class="stat-card-header">
                        <div class="stat-card-icon blue"></div>
                    </div>
                    <div class="stat-card-value" id="stat-match-score">—</div>
                    <div class="stat-card-label">Resume Match Score</div>
                </div>
                <div class="stat-card fade-in-delay-2">
                    <div class="stat-card-header">
                        <div class="stat-card-icon green"></div>
                    </div>
                    <div class="stat-card-value" id="stat-applications">0</div>
                    <div class="stat-card-label">Applications Sent</div>
                </div>
                <div class="stat-card fade-in-delay-3">
                    <div class="stat-card-header">
                        <div class="stat-card-icon violet"></div>
                    </div>
                    <div class="stat-card-value" id="stat-saved">0</div>
                    <div class="stat-card-label">Saved Jobs</div>
                </div>
                <div class="stat-card fade-in-delay-4">
                    <div class="stat-card-header">
                        <div class="stat-card-icon amber"></div>
                    </div>
                    <div class="stat-card-value" id="stat-profile">0%</div>
                    <div class="stat-card-label">Profile Completion</div>
                </div>
            </div>

            <!-- Middle Row: Resume Health + Skills Gap + AI Suggestions -->
            <div class="widgets-grid-3" id="dashboard-widgets">
                <!-- Resume Health -->
                <div class="widget fade-in-delay-2">
                    <div class="widget-header">
                        <h3 class="widget-title">Resume Health</h3>
                        <button class="widget-action" onclick="navigateTo('profile')">View Profile</button>
                    </div>
                    <div id="resume-health-content">
                        <div class="empty-state" style="padding: var(--space-4);">
                            <p style="font-size: 0.813rem;">Upload a resume to see health analysis.</p>
                        </div>
                    </div>
                </div>

                <!-- Skills Gap Analysis -->
                <div class="widget fade-in-delay-3">
                    <div class="widget-header">
                        <h3 class="widget-title">Skills Gap</h3>
                        <button class="widget-action" onclick="navigateTo('recommended-jobs')">Browse Jobs</button>
                    </div>
                    <div id="skills-gap-content">
                        <div class="empty-state" style="padding: var(--space-4);">
                            <p style="font-size: 0.813rem;">Upload a resume to see skills analysis.</p>
                        </div>
                    </div>
                </div>

                <!-- AI Suggestions -->
                <div class="widget fade-in-delay-4">
                    <div class="widget-header">
                        <h3 class="widget-title">AI Suggestions</h3>
                    </div>
                    <div id="ai-suggestions-content">
                        <div class="empty-state" style="padding: var(--space-4);">
                            <p style="font-size: 0.813rem;">Insights will appear after resume analysis.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Recent Activity -->
            <div class="widget fade-in-delay-4">
                <div class="widget-header">
                    <h3 class="widget-title">Recent Activity</h3>
                    <button class="widget-action" onclick="navigateTo('applications')">View All</button>
                </div>
                <div id="recent-activity-content">
                    <div class="empty-state" style="padding: var(--space-6);">
                        <div class="empty-state-icon"></div>
                        <h3>No activity yet</h3>
                        <p>Start by uploading your resume or browsing jobs.</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- RECOMMENDED JOBS -->
    <template id="view-recommended-jobs">
        <div class="fade-in">
            <div class="page-header">
                <h1>Recommended Jobs</h1>
                <p>AI-matched opportunities based on your resume profile.</p>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar" id="job-filter-bar">
                <input type="text" class="search-input" id="job-search-input" placeholder="Search by title, skill, or company..." oninput="debounceJobSearch()">
                <select class="filter-select" id="filter-location" onchange="applyJobFilters()">
                    <option value="">All Locations</option>
                    <option value="remote">Remote</option>
                    <option value="onsite">On-site</option>
                </select>
                <select class="filter-select" id="filter-experience" onchange="applyJobFilters()">
                    <option value="">Experience Level</option>
                    <option value="entry">Entry Level</option>
                    <option value="mid">Mid Level</option>
                    <option value="senior">Senior Level</option>
                </select>
                <select class="filter-select" id="filter-type" onchange="applyJobFilters()">
                    <option value="">Employment Type</option>
                    <option value="full-time">Full Time</option>
                    <option value="part-time">Part Time</option>
                    <option value="contract">Contract</option>
                </select>
            </div>

            <!-- Job Grid -->
            <div class="job-grid" id="recommended-jobs-grid">
                <!-- Job cards rendered by JS -->
            </div>

            <!-- Pagination -->
            <div class="pagination" id="jobs-pagination"></div>
        </div>
    </template>

    <!-- SAVED JOBS -->
    <template id="view-saved-jobs">
        <div class="fade-in">
            <div class="page-header">
                <h1>Saved Jobs</h1>
                <p>Jobs you've bookmarked for later review.</p>
            </div>
            <div id="saved-jobs-container">
                <!-- Rendered by JS -->
            </div>
        </div>
    </template>

    <!-- APPLICATIONS -->
    <template id="view-applications">
        <div class="fade-in">
            <div class="page-header">
                <h1>My Applications</h1>
                <p>Track the status of your job applications.</p>
            </div>
            <div class="application-list" id="applications-list">
                <!-- Rendered by JS -->
            </div>
        </div>
    </template>

    <!-- PROFILE -->
    <template id="view-profile">
        <div class="fade-in profile-layout">
            <div class="page-header">
                <h1>My Profile</h1>
                <p>Manage your professional profile and resume.</p>
            </div>

            <!-- Profile Cover + Avatar -->
            <div style="position:relative; margin-bottom: var(--space-5);">
                <div class="profile-cover"></div>
                <div class="profile-avatar-lg" id="profile-avatar">?</div>
                <div class="profile-header-info">
                    <h2 id="profile-name">—</h2>
                    <p id="profile-email">—</p>
                </div>
            </div>

            <!-- Resume Upload Section -->
            <div class="profile-section">
                <div class="profile-section-header">
                    <h3>Resume</h3>
                </div>
                <form id="profile-upload-form" onsubmit="handleResumeUpload(event)">
                    <div class="upload-zone" id="profile-upload-zone" style="padding: var(--space-6);">
                        <input type="file" id="resume-file" accept=".pdf" onchange="handleResumeUpload(event)">
                        <div class="upload-zone-icon" style="font-size: 2rem;"></div>
                        <h3 style="font-size: 1rem;">Upload or replace your resume</h3>
                        <p>Drag & drop a PDF file or click to browse</p>
                    </div>
                </form>
                <div id="profile-upload-status" style="margin-top: var(--space-3);"></div>
            </div>

            <!-- Skills Section -->
            <div class="profile-section">
                <div class="profile-section-header">
                    <h3>Skills</h3>
                </div>
                <div id="profile-skills-container" class="skills-container">
                    <p class="text-secondary" style="font-size: 0.813rem;">Upload a resume to extract your skills.</p>
                </div>
            </div>

            <!-- Experience Section -->
            <div class="profile-section">
                <div class="profile-section-header">
                    <h3>Experience</h3>
                </div>
                <div id="profile-experience-container">
                    <p class="text-secondary" style="font-size: 0.813rem;">Upload a resume to extract your experience.</p>
                </div>
            </div>

            <!-- Education Section -->
            <div class="profile-section">
                <div class="profile-section-header">
                    <h3>Education</h3>
                </div>
                <div id="profile-education-container">
                    <p class="text-secondary" style="font-size: 0.813rem;">Education info will be available after resume analysis.</p>
                </div>
            </div>

            <!-- Certifications Section -->
            <div class="profile-section">
                <div class="profile-section-header">
                    <h3>Certifications</h3>
                </div>
                <div id="profile-certs-container">
                    <p class="text-secondary" style="font-size: 0.813rem;">Certifications will be available after resume analysis.</p>
                </div>
            </div>
        </div>
    </template>

    <!-- RECRUITER DASHBOARD -->
    <template id="view-recruiter-dashboard">
        <div class="fade-in">
            <div class="page-header">
                <h1>Recruiter Dashboard</h1>
                <p>Post jobs and find the best AI-matched talent.</p>
            </div>

            <div class="recruiter-grid">
                <!-- Create Job -->
                <div class="widget">
                    <div class="widget-header">
                        <h3 class="widget-title">Post a New Job</h3>
                    </div>
                    <form id="create-job-form" onsubmit="handleCreateJob(event)">
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" id="job-title" class="form-input" required placeholder="e.g. Senior Frontend Engineer">
                        </div>
                        <div class="form-group">
                            <label>Company</label>
                            <input type="text" id="job-company" class="form-input" placeholder="e.g. Acme Corp">
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" id="job-location" class="form-input" placeholder="e.g. Remote / San Francisco, CA">
                        </div>
                        <div class="form-group">
                            <label>Required Skills (comma separated)</label>
                            <input type="text" id="job-skills" class="form-input" required placeholder="React, TypeScript, CSS">
                        </div>
                        <div class="form-group">
                            <label>Experience Required</label>
                            <input type="text" id="job-experience" class="form-input" required placeholder="3-5 years">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="job-description" class="form-input" rows="4" placeholder="Full job description..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Post Job</button>
                        <div id="job-post-status" style="margin-top: var(--space-3);"></div>
                    </form>
                </div>

                <!-- My Posted Jobs -->
                <div class="widget">
                    <div class="widget-header">
                        <h3 class="widget-title">My Posted Jobs</h3>
                    </div>
                    <div id="recruiter-jobs-container" style="max-height: 500px; overflow-y: auto;">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- Search Candidates -->
            <div class="widget" style="margin-bottom: var(--space-7);">
                <div class="widget-header">
                    <h3 class="widget-title">Search Talent Database</h3>
                </div>
                <div style="display: flex; gap: var(--space-3); margin-bottom: var(--space-4);">
                    <input type="text" id="candidate-search-input" class="form-input" placeholder="Search skills (e.g. React, Python)" onkeypress="if(event.key==='Enter') searchCandidates()" style="flex:1;">
                    <button class="btn btn-primary" onclick="searchCandidates()">Search</button>
                </div>
                <div id="candidate-search-results"></div>
            </div>

            <!-- Applicants Section (shown when clicking a job) -->
            <div id="applicants-section" class="hidden">
                <div class="widget">
                    <div class="widget-header">
                        <h3 class="widget-title">Applicants for: <span id="selected-job-title" class="gradient-text"></span></h3>
                    </div>
                    <div id="applicants-container">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ===================== JOB DETAILS DRAWER ===================== -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="closeJobDrawer()"></div>
    <div id="job-drawer" class="drawer">
        <div class="drawer-header">
            <h3 id="drawer-job-title" style="font-size: 1rem;">Job Details</h3>
            <button class="drawer-close" onclick="closeJobDrawer()">✕</button>
        </div>
        <div class="drawer-body" id="drawer-body">
            <!-- Populated by JS -->
        </div>
        <div class="drawer-footer" id="drawer-footer">
            <!-- Action buttons populated by JS -->
        </div>
    </div>

    <!-- ===================== CHAT WIDGET ===================== -->
    <div id="chat-widget" class="chat-widget hidden">
        <div class="chat-header" onclick="toggleChat()">
            <span>AI Career Assistant</span>
            <span>▼</span>
        </div>
        <div class="chat-body" id="chat-messages">
            <div class="message ai">Hi! I'm your AI career assistant. Ask me for career advice, resume tips, or interview questions. </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatEnter(event)">
            <button class="btn btn-primary btn-sm" onclick="sendChatMessage()">Send</button>
        </div>
    </div>
    <button id="chat-toggle-btn" class="chat-toggle-btn hidden" onclick="toggleChat()">AI Assistant</button>

    <!-- ===================== TOAST CONTAINER ===================== -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/app.js"></script>
</body>

</html>
