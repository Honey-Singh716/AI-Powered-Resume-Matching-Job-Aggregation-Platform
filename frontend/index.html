<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruitAI — AI-Powered Job Matching Platform</title>
    <meta name="description" content="Upload your resume and get AI-powered job recommendations, skills analysis, and career insights. Find your perfect match.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div id="app">
        <!-- Sidebar (injected by JS for authenticated views) -->
        <aside id="sidebar" class="sidebar hidden"></aside>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Wrapper -->
        <div id="main-wrapper" class="main-wrapper no-sidebar">
            <!-- Topbar (injected by JS for authenticated views) -->
            <header id="topbar" class="topbar hidden"></header>

            <!-- Main Content Area — views injected here -->
            <main id="main-content"></main>
        </div>
    </div>

    <!-- ===================== TEMPLATES ===================== -->

    <!-- LANDING PAGE -->
    <template id="view-landing">
        <div class="landing-page ci-editorial-theme">
            <!-- Ambient Background Elements (Warm Workspace Lighting, Botanical Accents & Natural Contours) -->
            <div class="ci-workspace-ambiance" aria-hidden="true">
                <div class="ci-ambient-light"></div>
                <div class="ci-window-beam"></div>
                <!-- Botanical greenery accents framing corners -->
                <svg class="ci-foliage ci-foliage-tr" viewBox="0 0 340 320" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M340 0 C280 40, 220 90, 210 170 C200 240, 240 290, 320 320" stroke="#123B2F" stroke-width="2.5" stroke-linecap="round" opacity="0.32"/>

                    <path d="M225 125 C190 90, 190 40, 210 10 C230 40, 235 90, 225 125 Z" fill="#A9BDA9" opacity="0.42"/>
                    <path d="M250 80 C230 40, 250 10, 280 0 C290 30, 280 60, 250 80 Z" fill="#123B2F" opacity="0.25"/>
                    <path d="M220 220 C170 210, 140 180, 135 140 C165 155, 195 185, 220 220 Z" fill="#A9BDA9" opacity="0.35"/>
                    <path d="M255 260 C210 265, 185 245, 175 215 C205 220, 235 240, 255 260 Z" fill="#123B2F" opacity="0.18"/>
                </svg>
                <svg class="ci-foliage ci-foliage-bl" viewBox="0 0 320 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 300 C60 260, 110 210, 130 140 C145 80, 110 30, 40 0" stroke="#123B2F" stroke-width="2.5" stroke-linecap="round" opacity="0.28"/>
                    <path d="M130 140 C175 165, 190 205, 180 240 C150 220, 135 185, 130 140 Z" fill="#123B2F" opacity="0.18"/>
                    <path d="M115 190 C150 225, 150 270, 135 295 C115 265, 110 220, 115 190 Z" fill="#A9BDA9" opacity="0.4"/>
                    <path d="M95 100 C140 105, 165 85, 170 55 C145 60, 115 75, 95 100 Z" fill="#A9BDA9" opacity="0.3"/>
                </svg>
                <!-- Subtle organic contour waves -->
                <svg class="ci-contour-ribbon" viewBox="0 0 1440 600" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 380 C 350 280, 750 490, 1150 340 C 1300 280, 1400 300, 1440 320" stroke="#A9BDA9" stroke-width="1.8" stroke-dasharray="8 8" opacity="0.35"/>
                    <path d="M 0 440 C 400 340, 850 540, 1250 400 C 1370 360, 1420 370, 1440 380" stroke="#DDD4C2" stroke-width="1.5" opacity="0.45"/>
                </svg>
            </div>

            <!-- Top Navigation -->
            <nav class="ci-nav">
                <div class="ci-nav-inner">
                    <a href="#landing-hero" class="ci-brand-link">
                        <div class="ci-brand-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                                <rect width="24" height="24" rx="6" fill="#123B2F"/>
                                <path d="M6 16.5C8.5 14 11 11.5 18 7.5C14 14.5 11.5 17 9 19.5" stroke="#F5F2E9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="8" cy="18" r="1.5" fill="#A9BDA9"/>
                            </svg>
                        </div>
                        <span class="ci-brand-text">Recruit<span class="ci-brand-ai">AI</span></span>
                        <span class="ci-brand-tag">Intelligence</span>
                    </a>

                    <div class="ci-nav-center">
                        <a href="#how-it-works" class="ci-nav-item">How It Works</a>
                        <a href="#about-section" class="ci-nav-item">About</a>
                        <a href="#contact-section" class="ci-nav-item">Contact</a>
                    </div>

                    <div class="ci-nav-actions">
                        <button class="ci-btn-ghost" onclick="navigateTo('login')">Sign In</button>
                        <button class="ci-btn-primary ci-btn-nav" onclick="navigateTo('login')">
                            <span>Get Started</span>
                        </button>
                        <button class="ci-mobile-toggle" onclick="toggleMobileLandingNav()" aria-label="Toggle navigation">
                            <span></span><span></span><span></span>
                        </button>
                    </div>
                </div>
                <!-- Mobile Navigation Dropdown -->
                <div class="ci-mobile-menu" id="ci-mobile-menu">
                    <a href="#how-it-works" onclick="closeMobileLandingNav()">How It Works</a>
                    <a href="#about-section" onclick="closeMobileLandingNav()">About</a>
                    <a href="#contact-section" onclick="closeMobileLandingNav()">Contact</a>
                    <div class="ci-mobile-menu-actions">
                        <button class="ci-btn-ghost btn-full" onclick="closeMobileLandingNav(); navigateTo('login')">Sign In</button>
                        <button class="ci-btn-primary btn-full" onclick="closeMobileLandingNav(); navigateTo('login')">Get Started Free</button>
                    </div>
                </div>
            </nav>

            <!-- 1. Hero Section -->
            <section class="ci-hero-section" id="landing-hero">
                <input type="file" id="landing-upload-input" accept=".pdf" style="display:none;" onchange="handleLandingUpload(event)">
                <div id="landing-upload-status" style="display:none;"></div>

                <div class="ci-container ci-hero-grid">
                    <!-- Left Column: Copy & Actions -->
                    <div class="ci-hero-col-left">
                        <div class="ci-pill-badge">
                            <svg class="ci-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                            </svg>
                            <span>AI-POWERED CAREER INTELLIGENCE</span>
                        </div>

                        <h1 class="ci-hero-title">
                            Find the Right Opportunities.
                            <span class="ci-serif-accent">Let Your Skills Lead.</span>
                        </h1>

                        <p class="ci-hero-subtitle">
                            Upload your resume, get AI-driven job matches, skill gap insights, and personalized recommendations — all calibrated to your unique background and real market demand.
                        </p>

                        <div class="ci-hero-actions">
                            <button class="ci-btn-primary ci-btn-hero" onclick="triggerHeroUpload()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <span>Upload Your Resume</span>
                            </button>
                            <button class="ci-btn-secondary ci-btn-hero" onclick="navigateTo('login')">
                                <span>Get Started Free &rarr;</span>
                            </button>
                        </div>

                        <div class="ci-hero-highlights">
                            <div class="ci-highlight-item">
                                <span class="ci-highlight-dot"></span>
                                <span>Resume Intelligence</span>
                            </div>
                            <span class="ci-highlight-sep">|</span>
                            <div class="ci-highlight-item">
                                <span class="ci-highlight-dot"></span>
                                <span>Semantic Job Matching</span>
                            </div>
                            <span class="ci-highlight-sep">|</span>
                            <div class="ci-highlight-item">
                                <span class="ci-highlight-dot"></span>
                                <span>Skill Gap Analysis</span>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Product Showcase UI (Reference Image Matching) -->
                    <div class="ci-hero-col-right">
                        <div class="ci-showcase-container" id="hero-showcase">
                            <!-- Dashed Flow Connections SVG -->
                            <svg class="ci-flow-svg" viewBox="0 0 520 405" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M 170 28 C 220 28, 250 60, 250 95" stroke="#A9BDA9" stroke-width="1.8" stroke-dasharray="4 4"/>
                                <path d="M 360 140 C 400 140, 410 160, 415 190" stroke="#A9BDA9" stroke-width="1.8" stroke-dasharray="4 4"/>
                                <path d="M 215 255 C 215 285, 225 300, 230 315" stroke="#A9BDA9" stroke-width="1.8" stroke-dasharray="4 4"/>
                            </svg>

                            <!-- Node 1: Floating Resume.pdf badge -->
                            <div class="ci-float-badge ci-node-resume">
                                <div class="ci-resume-icon-badge">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                        <polyline points="14 2 14 8 20 8"></polyline>
                                        <line x1="16" y1="13" x2="8" y2="13"></line>
                                        <line x1="16" y1="17" x2="8" y2="17"></line>
                                        <polyline points="10 9 9 9 8 9"></polyline>
                                    </svg>
                                </div>
                                <div class="ci-resume-meta">
                                    <span class="ci-resume-name" id="showcase-resume-name">Resume.pdf</span>
                                    <span class="ci-resume-status">Parsed &amp; Vectorized</span>
                                </div>
                                <span class="ci-pulse-dot" title="Active"></span>
                            </div>

                            <!-- Node 2: Central Main Card — Match Overview -->
                            <div class="ci-card ci-card-match-overview">
                                <div class="ci-card-topbar">
                                    <h3 class="ci-card-title">Match Overview</h3>
                                    <span class="ci-tag-soft">
                                        <span class="ci-live-dot"></span> Live Vector Model
                                    </span>
                                </div>

                                <div class="ci-match-overview-grid">
                                    <!-- Circular Progress Ring -->
                                    <div class="ci-ring-box">
                                        <div class="ci-ring-relative">
                                            <svg class="ci-svg-ring" viewBox="0 0 100 100">
                                                <circle class="ci-ring-track" cx="50" cy="50" r="38" stroke="#E2EDE2" stroke-width="8" fill="none"/>
                                                <circle class="ci-ring-progress" id="showcase-ring-stroke" cx="50" cy="50" r="38" stroke="#123B2F" stroke-width="8" fill="none"
                                                        stroke-dasharray="238.7" stroke-dashoffset="19.1" stroke-linecap="round"/>
                                            </svg>
                                            <div class="ci-ring-center-content">
                                                <span class="ci-ring-score" id="showcase-match-val">92%</span>
                                                <span class="ci-ring-sub">Match Score</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 4 Checklist Items -->
                                    <div class="ci-match-checklist">
                                        <div class="ci-check-row">
                                            <div class="ci-check-circle">✓</div>
                                            <span>Skills Matched</span>
                                        </div>
                                        <div class="ci-check-row">
                                            <div class="ci-check-circle">✓</div>
                                            <span>Experience Aligned</span>
                                        </div>
                                        <div class="ci-check-row">
                                            <div class="ci-check-circle">✓</div>
                                            <span>Role Fit</span>
                                        </div>
                                        <div class="ci-check-row">
                                            <div class="ci-check-circle">✓</div>
                                            <span>High Relevance</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Node 3: Top-Right Floating Card — Recommended Jobs -->
                            <div class="ci-card ci-card-recommended">
                                <div class="ci-card-mini-head">
                                    <div class="ci-mini-title-wrap">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                        </svg>
                                        <h4>Recommended Jobs</h4>
                                    </div>
                                </div>
                                <div class="ci-mini-job-list" id="showcase-jobs-list">
                                    <div class="ci-mini-job-item">
                                        <div class="ci-mini-job-text">
                                            <span class="ci-mini-role">Data Scientist</span>
                                            <span class="ci-mini-company">GitHub • San Francisco</span>
                                        </div>
                                        <span class="ci-match-pill">93% Match</span>
                                    </div>
                                    <div class="ci-mini-job-item">
                                        <div class="ci-mini-job-text">
                                            <span class="ci-mini-role">ML Engineer</span>
                                            <span class="ci-mini-company">Pivotal • Remote</span>
                                        </div>
                                        <span class="ci-match-pill">90% Match</span>
                                    </div>
                                    <div class="ci-mini-job-item">
                                        <div class="ci-mini-job-text">
                                            <span class="ci-mini-role">NLP Engineer</span>
                                            <span class="ci-mini-company">Twitch • New York</span>
                                        </div>
                                        <span class="ci-match-pill">87% Match</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Node 4: Bottom-Left Floating Card — Skill Gap Analysis -->
                            <div class="ci-card ci-card-skill-gap">
                                <div class="ci-card-mini-head">
                                    <div class="ci-mini-title-wrap">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <line x1="12" y1="8" x2="12" y2="16"></line>
                                            <line x1="8" y1="12" x2="16" y2="12"></line>
                                        </svg>
                                        <h4>Skill Gap Analysis</h4>
                                    </div>
                                </div>
                                <div class="ci-gap-content">
                                    <div class="ci-gap-row">
                                        <div class="ci-gap-labels">
                                            <span>Your Skills</span>
                                            <span class="ci-gap-pct" id="showcase-skills-num">85%</span>
                                        </div>
                                        <div class="ci-gap-track">
                                            <div class="ci-gap-fill ci-fill-forest" id="showcase-skills-fill" style="width: 85%;"></div>
                                        </div>
                                    </div>
                                    <div class="ci-gap-row">
                                        <div class="ci-gap-labels">
                                            <span>Job Requirements</span>
                                            <span class="ci-gap-pct" id="showcase-req-num">92%</span>
                                        </div>
                                        <div class="ci-gap-track">
                                            <div class="ci-gap-fill ci-fill-sage" id="showcase-req-fill" style="width: 92%;"></div>
                                        </div>
                                    </div>
                                    <div class="ci-gap-row">
                                        <div class="ci-gap-labels">
                                            <span>Gap</span>
                                            <span class="ci-gap-pct" id="showcase-gap-num">7%</span>
                                        </div>
                                        <div class="ci-gap-track">
                                            <div class="ci-gap-fill ci-fill-beige" id="showcase-gap-fill" style="width: 7%;"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Node 5: Ambient Warm Desk Books (Bottom-Right Foreground) -->
                            <div class="ci-ambient-books" aria-hidden="true">
                                <div class="ci-spine ci-spine-1"><span>Career</span></div>
                                <div class="ci-spine ci-spine-2"><span>AI &amp; ML</span></div>
                                <div class="ci-spine ci-spine-3"><span>Data Science</span></div>
                                <div class="ci-spine ci-spine-4"><span>Interview Prep</span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Analysis Preview Card (appears after resume is uploaded) -->
                <div id="landing-analysis-wrap" class="ci-container ci-analysis-wrap hidden">
                    <div id="landing-analysis-preview" class="ci-analysis-preview"></div>
                </div>
            </section>

            <!-- 2. How It Works Section (Sage-Tinted #EEF3EE) -->
            <section class="ci-section ci-bg-sage" id="how-it-works">
                <div class="ci-container">
                    <div class="ci-section-header text-center">
                        <span class="ci-section-badge">THE PROCESS</span>
                        <h2 class="ci-section-title">How It Works — <span class="ci-serif-accent">From Resume to Opportunity</span></h2>
                        <p class="ci-section-subtitle">A streamlined 4-step intelligence system that eliminates the guesswork from your job search.</p>
                    </div>

                    <div class="ci-steps-grid">
                        <div class="ci-step-card">
                            <div class="ci-step-num">01</div>
                            <h3 class="ci-step-title">Upload Resume</h3>
                            <p class="ci-step-desc">Upload your PDF resume. Our AI parser extracts competencies, seniority, and quantifiable impact in seconds.</p>
                            <div class="ci-step-tags">
                                <span>PDF Extraction</span>
                                <span>ATS Parsing</span>
                            </div>
                        </div>

                        <div class="ci-step-card">
                            <div class="ci-step-num">02</div>
                            <h3 class="ci-step-title">Semantic Analysis</h3>
                            <p class="ci-step-desc">Advanced sentence-transformer embeddings encode your technical experience into high-dimensional vector space.</p>
                            <div class="ci-step-tags">
                                <span>Vector Embeddings</span>
                                <span>Domain Context</span>
                            </div>
                        </div>

                        <div class="ci-step-card">
                            <div class="ci-step-num">03</div>
                            <h3 class="ci-step-title">Precision Match</h3>
                            <p class="ci-step-desc">Scored across thousands of live vacancies using cosine similarity to rank true capability, not just keywords.</p>
                            <div class="ci-step-tags">
                                <span>Cosine Similarity</span>
                                <span>Live Feed Scoring</span>
                            </div>
                        </div>

                        <div class="ci-step-card">
                            <div class="ci-step-num">04</div>
                            <h3 class="ci-step-title">Skill Gap &amp; Apply</h3>
                            <p class="ci-step-desc">Review your match breakdown, bridge identified skill gaps with targeted insights, and apply with confidence.</p>
                            <div class="ci-step-tags">
                                <span>Gap Roadmap</span>
                                <span>Direct Apply</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 3. About Section (Warm Ivory Light #FAF8F4) -->
            <section class="ci-section ci-bg-ivory" id="about-section">
                <div class="ci-container">
                    <div class="ci-section-header text-center">
                        <span class="ci-section-badge">ABOUT RECRUITAI</span>
                        <h2 class="ci-section-title">Empowering Careers Through <span class="ci-serif-accent">True Skill Intelligence</span></h2>
                        <p class="ci-section-subtitle">We founded RecruitAI with a simple conviction: technical hiring shouldn't be a game of keyword matching. We built semantic AI to let your actual capability lead.</p>
                    </div>

                    <div class="ci-about-grid">
                        <div class="ci-about-card">
                            <div class="ci-about-icon-box">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                </svg>
                            </div>
                            <h3 class="ci-about-title">Context Over Keywords</h3>
                            <p class="ci-about-desc">Traditional applicant tracking systems discard great engineers over missing synonym tags. Our 384-dimensional semantic models understand the true depth of your technical experience.</p>
                        </div>

                        <div class="ci-about-card">
                            <div class="ci-about-icon-box">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="20" x2="18" y2="10"></line>
                                    <line x1="12" y1="20" x2="12" y2="4"></line>
                                    <line x1="6" y1="20" x2="6" y2="14"></line>
                                </svg>
                            </div>
                            <h3 class="ci-about-title">Actionable Skill Diagnostics</h3>
                            <p class="ci-about-desc">We believe in transparent hiring feedback. Instead of automated rejections, our skill gap analysis reveals exactly which competencies will accelerate your interview readiness.</p>
                        </div>

                        <div class="ci-about-card">
                            <div class="ci-about-icon-box">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </div>
                            <h3 class="ci-about-title">Candidate-First Privacy</h3>
                            <p class="ci-about-desc">Your resume and personal details are strictly encrypted. We never sell candidate profiles or trigger unauthorized recruiter outreach. You stay in control at all times.</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 4. Contact Section ("contact like") (Sage-Tinted #EEF3EE) -->
            <section class="ci-section ci-bg-sage" id="contact-section">
                <div class="ci-container">
                    <div class="ci-section-header text-center">
                        <span class="ci-section-badge">GET IN TOUCH</span>
                        <h2 class="ci-section-title">Have Questions? <span class="ci-serif-accent">We're Here to Help</span></h2>
                        <p class="ci-section-subtitle">Whether you're a candidate exploring new roles, an employer looking for verified talent, or just have feedback, reach out to our team.</p>
                    </div>

                    <div class="ci-contact-grid">
                        <!-- Left: Contact Information -->
                        <div class="ci-contact-info-card">
                            <div class="ci-contact-detail">
                                <div class="ci-contact-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                        <polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                </div>
                                <div class="ci-contact-text">
                                    <h4>General Support</h4>
                                    <p><a href="mailto:support@recruitai.com">support@recruitai.com</a></p>
                                </div>
                            </div>

                            <div class="ci-contact-detail">
                                <div class="ci-contact-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                    </svg>
                                </div>
                                <div class="ci-contact-text">
                                    <h4>Employer Partnerships</h4>
                                    <p><a href="mailto:partners@recruitai.com">partners@recruitai.com</a></p>

                                <button type="button" class="pf-add-link" data-pf-action="toggle-certification">+ Add Certification</button>
                            </div>
                            <div id="pf-cert-list" class="pf-entries"></div>
                            <div id="pf-cert-form" class="pf-form hidden">
                                <p id="pf-cert-error" class="pf-field-error" role="alert"></p>
                                <div class="pf-form-grid">
                                    <label class="pf-field" for="pf-cert-name"><span>Certification</span><input id="pf-cert-name" class="pf-input" type="text" maxlength="160"></label>
                                    <label class="pf-field" for="pf-cert-issuer"><span>Issuer</span><input id="pf-cert-issuer" class="pf-input" type="text" maxlength="160"></label>
                                    <label class="pf-field" for="pf-cert-year"><span>Year</span><input id="pf-cert-year" class="pf-input" type="text" inputmode="numeric" maxlength="4" placeholder="YYYY"></label>
                                </div>
                                <div class="pf-form-actions">
                                    <button type="button" class="pf-btn pf-btn-primary" id="pf-cert-submit" data-pf-action="submit-certification">Add certification</button>
                                    <button type="button" class="pf-btn pf-btn-ghost" data-pf-action="cancel-form" data-pf-form="certification">Cancel</button>
                                </div>
                            </div>
                        </section>

                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- RECRUITER DASHBOARD -->
    <template id="view-recruiter-dashboard">
        <div class="fade-in">
            <div class="page-header">
                <h1>Recruiter Dashboard</h1>
                <p>Post jobs and find the best AI-matched talent.</p>
            </div>

            <div class="recruiter-grid">
                <!-- Create Job -->
                <div class="widget">
                    <div class="widget-header">
                        <h3 class="widget-title">Post a New Job</h3>
                    </div>
                    <form id="create-job-form" onsubmit="handleCreateJob(event)">
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" id="job-title" class="form-input" required placeholder="e.g. Senior Frontend Engineer">
                        </div>
                        <div class="form-group">
                            <label>Company</label>
                            <input type="text" id="job-company" class="form-input" placeholder="e.g. Acme Corp">
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" id="job-location" class="form-input" placeholder="e.g. Remote / San Francisco, CA">
                        </div>
                        <div class="form-group">
                            <label>Required Skills (comma separated)</label>
                            <input type="text" id="job-skills" class="form-input" required placeholder="React, TypeScript, CSS">
                        </div>
                        <div class="form-group">
                            <label>Experience Required</label>
                            <input type="text" id="job-experience" class="form-input" required placeholder="3-5 years">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="job-description" class="form-input" rows="4" placeholder="Full job description..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Post Job</button>
                        <div id="job-post-status" style="margin-top: var(--space-3);"></div>
                    </form>
                </div>

                <!-- My Posted Jobs -->
                <div class="widget">
                    <div class="widget-header">
                        <h3 class="widget-title">My Posted Jobs</h3>
                    </div>
                    <div id="recruiter-jobs-container" style="max-height: 500px; overflow-y: auto;">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- Search Candidates -->
            <div class="widget" style="margin-bottom: var(--space-7);">
                <div class="widget-header">
                    <h3 class="widget-title">Search Talent Database</h3>
                </div>
                <div style="display: flex; gap: var(--space-3); margin-bottom: var(--space-4);">
                    <input type="text" id="candidate-search-input" class="form-input" placeholder="Search skills (e.g. React, Python)" onkeypress="if(event.key==='Enter') searchCandidates()" style="flex:1;">
                    <button class="btn btn-primary" onclick="searchCandidates()">Search</button>
                </div>
                <div id="candidate-search-results"></div>
            </div>

            <!-- Applicants Section (shown when clicking a job) -->
            <div id="applicants-section" class="hidden">
                <div class="widget">
                    <div class="widget-header">
                        <h3 class="widget-title">Applicants for: <span id="selected-job-title" class="gradient-text"></span></h3>
                    </div>
                    <div id="applicants-container">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ===================== JOB DETAILS DRAWER ===================== -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="closeJobDrawer()"></div>
    <div id="job-drawer" class="drawer">
        <div class="drawer-header">
            <h3 id="drawer-job-title" style="font-size: 1rem;">Job Details</h3>
            <button class="drawer-close" onclick="closeJobDrawer()">✕</button>
        </div>
        <div class="drawer-body" id="drawer-body">
            <!-- Populated by JS -->
        </div>
        <div class="drawer-footer" id="drawer-footer">
            <!-- Action buttons populated by JS -->
        </div>
    </div>

    <!-- ===================== CHAT WIDGET ===================== -->
    <div id="chat-widget" class="chat-widget hidden">
        <div class="chat-header" onclick="toggleChat()">
            <span>AI Career Assistant</span>
            <span>▼</span>
        </div>
        <div class="chat-body" id="chat-messages">
            <div class="message ai">Hi! I'm your AI career assistant. Ask me for career advice, resume tips, or interview questions. </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatEnter(event)">
            <button class="btn btn-primary btn-sm" onclick="sendChatMessage()">Send</button>
        </div>
    </div>
    <button id="chat-toggle-btn" class="chat-toggle-btn hidden" onclick="toggleChat()">AI Assistant</button>

    <!-- ===================== TOAST CONTAINER ===================== -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/app.js"></script>
    <script src="/profile.js"></script>
</body>

</html>
