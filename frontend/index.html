<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Matcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="app">
        <!-- Navigation -->
        <nav id="navbar" class="hidden">
            <div class="nav-container">
                <div class="logo">AI Resume Matcher</div>
                <div class="nav-links" id="nav-links">
                    <!-- Links injected dynamically -->
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Views will be injected here -->
        </main>
    </div>

    <!-- Templates -->
    <template id="view-login">
        <div class="auth-container">
            <div class="auth-card glass-panel">
                <h1 class="gradient-text">Welcome Back</h1>
                <p class="subtitle">Log in or create an account to continue.</p>

                <div class="tabs">
                    <button class="tab active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab" onclick="switchAuthTab('register')">Register</button>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>

                    <!-- Only visible on register -->
                    <div class="input-group" id="role-group" style="display: none;">
                        <label for="role">Role</label>
                        <select id="role">
                            <option value="candidate">Candidate</option>
                            <option value="recruiter">Recruiter</option>
                        </select>
                    </div>

                    <div id="auth-error" class="error-msg"></div>

                    <button type="submit" class="btn primary-btn full-width" id="auth-submit">Login</button>
                </form>
            </div>
        </div>
    </template>

    <template id="view-candidate-dashboard">
        <div class="dashboard-container fade-in">
            <header class="dashboard-header">
                <h2>Candidate Dashboard</h2>
                <p>Manage your profile and find your next opportunity.</p>
            </header>

            <div class="grid-layout">
                <!-- Upload Section -->
                <div class="card upload-card glass-panel">
                    <h3>Upload Resume</h3>
                    <p>Upload a PDF resume to let AI extract your skills.</p>
                    <form id="upload-form" onsubmit="handleResumeUpload(event)">
                        <input type="file" id="resume-file" accept=".pdf" required class="file-input">
                        <button type="submit" class="btn primary-btn" id="upload-btn">Analyze Resume</button>
                    </form>
                    <div id="upload-status"></div>
                </div>

                <!-- My Profile Section -->
                <div class="card profile-card glass-panel">
                    <h3>My AI Profile</h3>
                    <div id="profile-content">
                        <p class="empty-state">Upload a resume to generate your profile.</p>
                    </div>
                </div>
            </div>

            <!-- Recommendations -->
            <div class="section-title">
                <h3>Recommended Jobs</h3>
            </div>
            <div id="recommendations-container" class="card-grid">
                <!-- Job cards injected here -->
            </div>

            <!-- Applied Jobs & Analytics -->
            <div class="grid-layout" style="margin-top: 2rem;">
                <div>
                    <div class="section-title" style="margin-top:0;">
                        <h3>My Applications</h3>
                    </div>
                    <div id="applications-container" class="list-container glass-panel">
                        <!-- Applied jobs injected here -->
                    </div>
                </div>
                <div class="glass-panel"
                    style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                    <h3 style="margin-bottom: 1rem;">Application Analytics</h3>
                    <canvas id="candidateChart" style="max-height: 250px;"></canvas>
                </div>
            </div>

            <!-- All Jobs with Search -->
            <div class="section-title"
                style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <h3>Browse All Jobs</h3>
                <input type="text" id="job-search-input" placeholder="Search jobs by title or skill..."
                    oninput="handleJobSearch()" style="max-width: 300px;">
            </div>
            <div id="all-jobs-container" class="card-grid">
                <!-- All jobs injected here -->
            </div>
        </div>
    </template>

    <template id="view-recruiter-dashboard">
        <div class="dashboard-container fade-in">
            <header class="dashboard-header">
                <h2>Recruiter Dashboard</h2>
                <p>Post jobs and find the best AI-matched talent.</p>
            </header>

            <div class="grid-layout">
                <!-- Create Job Section -->
                <div class="card glass-panel">
                    <h3>Post a New Job</h3>
                    <form id="create-job-form" onsubmit="handleCreateJob(event)">
                        <div class="input-group">
                            <label>Job Title</label>
                            <input type="text" id="job-title" required placeholder="e.g. Senior Frontend Engineer">
                        </div>
                        <div class="input-group">
                            <label>Required Skills (comma separated)</label>
                            <input type="text" id="job-skills" required placeholder="React, TypeScript, CSS">
                        </div>
                        <div class="input-group">
                            <label>Experience Required</label>
                            <input type="text" id="job-experience" required placeholder="5+ years">
                        </div>
                        <button type="submit" class="btn primary-btn full-width">Post Job</button>
                        <div id="job-status"></div>
                    </form>
                </div>

                <!-- My Jobs Section -->
                <div class="card glass-panel list-card">
                    <h3>My Posted Jobs</h3>
                    <div id="recruiter-jobs-container" class="scroll-list">
                        <!-- Recruiter jobs injected here -->
                    </div>
                </div>
            </div>

            <!-- Search Candidates Section -->
            <div class="section-title"
                style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <h3>Search Talent Database</h3>
                <div style="display: flex; gap: 0.5rem; width: 100%; max-width: 400px;">
                    <input type="text" id="candidate-search-input" placeholder="Search skills (e.g. React, Python)"
                        onkeypress="if(event.key==='Enter') searchCandidates()" style="flex: 1; min-width: 0;">
                    <button class="btn primary-btn" onclick="searchCandidates()">Search</button>
                </div>
            </div>
            <div id="candidate-search-results" class="card-grid" style="margin-bottom: 2rem;">
                <!-- Search results injected here -->
            </div>

            <!-- Applicants Section -->
            <div id="applicants-section" class="hidden">
                <div class="section-title">
                    <h3>Applicants for: <span id="selected-job-title" class="gradient-text"></span></h3>
                </div>

                <div class="grid-layout">
                    <div id="applicants-container" class="scroll-list" style="max-height: 500px;">
                        <!-- Applicant cards injected here -->
                    </div>
                    <div class="glass-panel"
                        style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                        <h3 style="margin-bottom: 1rem;">Applicant Quality</h3>
                        <canvas id="recruiterChart" style="max-height: 300px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Chat Widget (Floating) -->
    <div id="chat-widget" class="chat-widget hidden">
        <div class="chat-header" onclick="toggleChat()">
            <span>AI Career Assistant</span>
            <span>▼</span>
        </div>
        <div class="chat-body" id="chat-messages">
            <div class="message ai">Hi! Ask me for career advice, resume tips, or interview questions.</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatEnter(event)">
            <button class="btn primary-btn" onclick="sendChatMessage()" style="padding: 0.5rem 1rem;">Send</button>
        </div>
    </div>
    <button id="chat-toggle-btn" class="chat-toggle-btn" onclick="toggleChat()">💬 AI Assistant</button>

    <script src="/app.js"></script>
</body>

</html>
